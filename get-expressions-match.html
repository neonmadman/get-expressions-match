<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Expressions with GET — Match the Meanings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script>
/* ====================== EDIT THIS FOR EACH LESSON ====================== */
const HEADER_TITLE = "EXPRESSIONS WITH GET";
const HEADER_SUBTITLE_PLAIN = "Match the expressions in";
const HEADER_SUBTITLE_BOLD = "BOLD";
const HEADER_SUBTITLE_TAIL = "with the meanings";

// EXPRESSIONS — the sentences with the bolded "get" phrase.
// Each also carries its matching MEANING and that meaning's fixed letter
// (independent of sentence order — see meaningsList below).
const ITEMS = [
  { sentence: "I can't wait to get away.", bold: "get away", meaning: "Go somewhere else", letter: "d" },
  { sentence: "I've always wanted to learn how to surf and I'll finally get to do it.", bold: "get to", meaning: "Have the chance to do something", letter: "c" },
  { sentence: "I couldn't get over just how strong they are.", bold: "couldn't get over", meaning: "Be very surprised by something", letter: "e" },
  { sentence: "Actually, I got into a bit of trouble once.", bold: "got into", meaning: "Find myself in difficulty", letter: "f" },
  { sentence: "I tried to get hold of it.", bold: "get hold of", meaning: "Take it in my hand", letter: "g" },
  { sentence: "It got swept away by the wave.", bold: "got swept away", meaning: "Go in a different direction in a powerful way", letter: "b" },
  { sentence: "I soon realized that I wasn't getting anywhere.", bold: "wasn't getting anywhere", meaning: "Make no progress", letter: "a" },
  { sentence: "I got the feeling I was being pulled out to sea.", bold: "got the feeling", meaning: "Have the sensation that", letter: "j" },
  { sentence: "So I waved to get someone's attention.", bold: "get someone's attention", meaning: "Make someone notice", letter: "i" },
  { sentence: "I had a bad experience, but I soon got over it.", bold: "got over", meaning: "Recover from something negative that happened", letter: "h" }
];
/* ========================================================================= */

const root = document.getElementById('app');

const styleTag = document.createElement('style');
styleTag.textContent = `
  html{ font-size: 100%; } /* baseline the A-/A/A+ control multiplies against */
  :root{
    --board:#e8f3fc;
    --board-line: rgba(15,30,45,0.09);
    --chalk:#12181f;
    --chalk-dim: rgba(18,24,31,0.62);
    --accent:#1f6fa8;
    --coral:#c9463c;
    --slot-empty: rgba(31,111,168,0.05);
    --slot-border: rgba(31,111,168,0.4);

    /* MEANINGS card — available (not yet placed) */
    --muted-bg: #FEEABE;
    --muted-bg-2: #FBDFA0;
    --muted-border: #D9AF5C;

    /* MEANINGS card — placed in a Bucket */
    --vibrant-bg: #ffe6ad;
    --vibrant-bg-2: #ffd97e;
    --vibrant-border: #d99a2b;

    /* Header accent + Expressions circle — requested #528CC7 tests at
       ~3.54:1 against white (fails the 4.5:1 small-text minimum);
       darkened to #4679AA (~4.6:1) to keep the hue and pass. */
    --header-accent: #4679AA;
    --expr-circle-bg: var(--header-accent);

    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.7), transparent 55%),
      var(--board);
    background-attachment: fixed;
    font-family: var(--font-body);
    color: var(--chalk);
    padding: 28px 16px 60px;
  }
  #app{ max-width: 1180px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 26px; }
  h1{
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: clamp(1.4rem, 1.1rem + 1.3vw, 1.9rem);
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--chalk);
  }
  .subtitle{
    font-size: 1rem;
    color: var(--chalk-dim);
    margin: 0 0 4px;
  }
  .subtitle strong{ color: var(--chalk); font-weight: 700; }

  .board{
    border: 1.5px dashed var(--slot-border);
    border-radius: 14px;
    padding: 24px 20px;
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(15,30,45,0.06);
  }

  /* Col 1: Meanings | Col 2+3: Buckets / Expressions */
  .layout{
    display: grid;
    grid-template-columns: 290px 1fr;
    gap: 34px;
    align-items: start;
  }

  /* ---------- shared column-header style ---------- */
  .col-header{
    font-family: var(--font-mono);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: clamp(0.85rem, 0.8rem + 0.25vw, 1rem);
    color: var(--header-accent);
    margin: 0 0 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--board-line);
  }

  /* ---------- Col 1: Meanings ---------- */
  .meanings-panel{ position: sticky; top: 16px; }
  .bank{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .bank .card{ width: 100%; height: auto; min-height: 50px; }
  .bank.drag-hover{ background: rgba(201,70,60,0.05); border-radius: 10px; }
  .bank-empty-msg{
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 2px;
  }

  /* ---------- Col 2 / 3: Buckets + Expressions ---------- */
  .header-row{
    display:grid;
    grid-template-columns: minmax(180px, 0.92fr) 34px 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }
  .rows-list{ display:flex; flex-direction:column; }
  .row{
    display:grid;
    grid-template-columns: minmax(180px, 0.92fr) 34px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 22px;
  }
  .row:last-child{ margin-bottom: 0; }

  .connector{
    text-align:center;
    color: var(--chalk-dim);
    font-size: 1.1rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .expression-line{
    display:flex;
    gap: 14px;
    align-items:center;
  }
  .expression-text{
    max-width: 62ch;
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    line-height: 1.5;
    color: var(--chalk);
  }
  .expression-text strong{ color: var(--chalk); font-weight: 700; }

  /* ---------- circles (Expressions = numbers, Meanings = letters) ---------- */
  .badge-circle{
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    color: #ffffff;
    text-transform: none; /* keeps letters lowercase even inside an uppercased .slot.filled */
  }
  .expr-circle{ background: var(--expr-circle-bg); }

  /* Meanings prefix reverted to a plain muted "a)" label — no circle,
     no bold color, just a quiet marker like the old sentence numbers. */
  .letter-label{
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--chalk-dim);
    margin-right: 8px;
    flex-shrink: 0;
    text-transform: none; /* stays lowercase even inside an uppercased .slot.filled */
  }

  .slot{
    min-height: 52px;
    border-radius: 10px;
    border: 1.5px dashed var(--slot-border);
    background: var(--slot-empty);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: background .15s, border-color .15s, transform .1s;
    position: relative;
  }
  .slot.filled{ border-style: solid; padding: 0; }
  .slot.hover{ background: rgba(31,111,168,0.12); border-color: var(--accent); }
  .slot:focus-visible, .card:focus-visible, button:focus-visible{
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
  }

  .card{
    width:100%;
    height:100%;
    padding: 12px 34px 12px 12px;
    border-radius: 9px;
    background: #ffffff;
    border: 1.5px solid var(--slot-border);
    color: #12181f;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    line-height: 1.3;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    text-align:left;
    cursor: grab;
    box-shadow: 0 2px 0 rgba(31,111,168,0.15), 0 4px 10px rgba(15,30,45,0.1);
    user-select: none;
    touch-action: none;
    position: relative;
    gap: 10px;
  }
  .card .meaning-text{
    flex: 1;
    font-size: clamp(0.9rem, 0.84rem + 0.35vw, 1.15rem); /* a notch smaller than Expressions text */
  }
  .card.dragging{ cursor: grabbing; box-shadow: 0 8px 20px rgba(15,30,45,0.22); }
  .card.selected{ outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .slot .card{
    font-weight: 600; /* semi-bold once placed, distinguishing it from the still-unplaced bank cards */
    background: linear-gradient(180deg, var(--vibrant-bg), var(--vibrant-bg-2));
    border-color: var(--vibrant-border);
    box-shadow: 0 2px 0 rgba(217,154,43,0.3), 0 4px 10px rgba(15,30,45,0.1);
  }
  .card.bank-card{
    background: linear-gradient(180deg, var(--muted-bg), var(--muted-bg-2));
    border-color: var(--muted-border);
    box-shadow: 0 2px 0 rgba(217,175,92,0.35), 0 4px 10px rgba(15,30,45,0.08);
  }

  .remove-btn{
    position: absolute;
    top: 4px;
    right: 4px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--vibrant-border);
    background: #ffffff;
    color: var(--chalk-dim);
    font-size: 15px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    padding: 0;
  }
  .remove-btn:hover{ background: var(--coral); border-color: var(--coral); color: #ffffff; }

  .drag-ghost{
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: 0.95;
    transform: translate(-50%, -50%) rotate(-2deg);
  }

  .progress-wrap{ max-width: 300px; margin: 0 auto 24px; }
  .progress-track{ height: 6px; border-radius: 4px; background: rgba(31,111,168,0.12); overflow:hidden; }
  .progress-fill{ height: 100%; background: var(--accent); width: 0%; transition: width .25s; }

  /* ---------- footer: text-size control ---------- */
  .footer-bar{ display:flex; justify-content: center; margin-top: 26px; }
  .text-scale-group{
    display:flex;
    align-items:stretch;
    border: 1.5px solid var(--slot-border);
    border-radius: 8px;
    overflow:hidden;
  }
  .text-scale-group button{
    border: none;
    border-radius: 0;
    border-right: 1.5px solid var(--slot-border);
  }
  .text-scale-group button:last-child{ border-right: none; }
  button{
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1.5px solid var(--slot-border);
    background: transparent;
    color: var(--chalk);
    cursor: pointer;
    transition: all .15s;
  }
  button:hover{ border-color: var(--accent); color: var(--accent); background: rgba(31,111,168,0.06); }

  @media (max-width: 780px){
    .layout{ grid-template-columns: 1fr; gap: 24px; }
    .meanings-panel{ position: static; }
    .bank{ flex-direction: row; flex-wrap: wrap; }
    .bank .card{ width: auto; flex: 1 1 170px; max-width: 260px; height: auto; min-height: 50px; }
    .header-row{ display:none; }
    .row{ grid-template-columns: 1fr; gap: 8px; }
    .connector{ display:none; }
  }
`;
document.head.appendChild(styleTag);

/* ---------------- state ---------------- */
let placed = {};
let selectedCard = null;
let textScalePct = 100;

// Bank order is fixed a→j by the assigned letter — everyone sees the same
// lettered list, like a printed worksheet, not a fresh shuffle each load.
const meaningsList = ITEMS.map((it, i) => ({...it, origIndex: i}))
  .sort((a, b) => a.letter.localeCompare(b.letter));

function boldify(sentence, boldPhrase){
  if (!boldPhrase) return sentence;
  const idx = sentence.indexOf(boldPhrase);
  if (idx === -1) return sentence;
  const before = sentence.slice(0, idx);
  const match = sentence.slice(idx, idx + boldPhrase.length);
  const after = sentence.slice(idx + boldPhrase.length);
  return `${before}<strong>${match}</strong>${after}`;
}

function render(){
  root.innerHTML = `
    <header>
      <h1>${HEADER_TITLE}</h1>
      <p class="subtitle">${HEADER_SUBTITLE_PLAIN} <strong>${HEADER_SUBTITLE_BOLD}</strong> ${HEADER_SUBTITLE_TAIL}</p>
    </header>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="board" id="board">
      <div class="layout">
        <div class="meanings-panel">
          <h2 class="col-header">Meanings</h2>
          <div class="bank" id="bank"></div>
        </div>
        <div class="buckets-expressions">
          <div class="header-row">
            <h2 class="col-header">Buckets</h2>
            <span></span>
            <h2 class="col-header">Expressions</h2>
          </div>
          <div class="rows-list">
            ${ITEMS.map((it, i) => `
              <div class="row">
                <div class="slot" data-slot="${i}" id="slot-${i}" role="button" tabindex="0" aria-label="Answer bucket for expression ${i+1}">drop here</div>
                <div class="connector">→</div>
                <div class="expression-line">
                  <span class="badge-circle expr-circle">${i+1}</span>
                  <span class="expression-text">${boldify(it.sentence, it.bold)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="footer-bar">
      <div class="text-scale-group" role="group" aria-label="Adjust text size">
        <button id="scaleDown" aria-label="Decrease text size">A−</button>
        <button id="scaleReset" aria-label="Reset text size">A</button>
        <button id="scaleUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
  `;
  renderBank();
  attachInteractions();
  attachScaleControls();
}

function renderBank(){
  const bank = document.getElementById('bank');
  bank.innerHTML = '';
  const usedIdxs = Object.values(placed).map(Number);
  let anyLeft = false;
  meaningsList.forEach((it) => {
    if (usedIdxs.includes(it.origIndex)) return;
    anyLeft = true;
    const card = document.createElement('div');
    card.className = 'card bank-card';
    card.dataset.cardIdx = it.origIndex;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `${it.letter}) ${it.meaning}`);
    card.innerHTML = `<span class="letter-label">${it.letter})</span><span class="meaning-text">${it.meaning}</span>`;
    bank.appendChild(card);
  });
  if (!anyLeft){
    bank.innerHTML = '<div class="bank-empty-msg">All meanings placed</div>';
  }
}

function updateProgress(){
  const filled = Object.keys(placed).length;
  const pct = Math.round((filled / ITEMS.length) * 100);
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

function placeCardInSlot(cardIdx, slotIdx){
  cardIdx = Number(cardIdx);
  slotIdx = Number(slotIdx);
  for (const [s, c] of Object.entries(placed)){
    if (Number(c) === cardIdx) delete placed[s];
  }
  if (placed[slotIdx] !== undefined) delete placed[slotIdx];
  placed[slotIdx] = cardIdx;
  selectedCard = null;
  renderSlots();
  renderBank();
  updateProgress();
  attachInteractions();
}

function removeFromSlot(slotIdx){
  if (placed[slotIdx] === undefined) return;
  delete placed[slotIdx];
  selectedCard = null;
  renderSlots();
  renderBank();
  updateProgress();
  attachInteractions();
}

function renderSlots(){
  ITEMS.forEach((_, i) => {
    const slotEl = document.getElementById('slot-' + i);
    if (!slotEl) return;
    slotEl.classList.remove('filled');
    if (placed[i] !== undefined){
      const cardData = ITEMS[placed[i]];
      slotEl.classList.add('filled');
      slotEl.innerHTML = `
        <div class="card" data-card-idx="${placed[i]}" data-placed-slot="${i}" role="button" tabindex="0" aria-label="${cardData.letter}) ${cardData.meaning}, placed. Press Delete to remove.">
          <span class="letter-label">${cardData.letter})</span><span class="meaning-text">${cardData.meaning}</span>
          <button class="remove-btn" data-remove-slot="${i}" aria-label="Remove this answer" type="button">×</button>
        </div>`;
    } else {
      slotEl.textContent = 'drop here';
    }
  });
}

/* ---------------- interactions ---------------- */
function attachInteractions(){
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (card.dataset.justDragged === '1') { card.dataset.justDragged = '0'; return; }
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      if (selectedCard === card.dataset.cardIdx){ selectedCard = null; }
      else { selectedCard = card.dataset.cardIdx; card.classList.add('selected'); }
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.click(); }
    });
    card.addEventListener('pointerdown', (e) => startDrag(e, card));
  });

  document.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('click', (e) => {
      if (e.target.closest('.remove-btn')) return;
      if (selectedCard !== null) placeCardInSlot(selectedCard, slot.dataset.slot);
    });
    slot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); slot.click(); }
    });
  });

  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromSlot(btn.dataset.removeSlot); });
  });
}

function attachScaleControls(){
  const clamp = (v) => Math.min(150, Math.max(70, v));
  const apply = () => { document.documentElement.style.fontSize = textScalePct + '%'; };
  document.getElementById('scaleDown').addEventListener('click', () => { textScalePct = clamp(textScalePct - 10); apply(); });
  document.getElementById('scaleUp').addEventListener('click', () => { textScalePct = clamp(textScalePct + 10); apply(); });
  document.getElementById('scaleReset').addEventListener('click', () => { textScalePct = 100; apply(); });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' && selectedCard !== null){
    const slotIdx = Object.keys(placed).find(s => String(placed[s]) === String(selectedCard));
    if (slotIdx !== undefined){ e.preventDefault(); removeFromSlot(slotIdx); }
  } else if (e.key === 'Escape' && selectedCard !== null){
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    selectedCard = null;
  }
});

let dragGhost = null;
let dragMoved = false;

function startDrag(e, card){
  e.preventDefault();
  dragMoved = false;
  const rect = card.getBoundingClientRect();
  const originSlot = card.dataset.placedSlot;

  dragGhost = card.cloneNode(true);
  dragGhost.classList.add('drag-ghost');
  dragGhost.style.width = rect.width + 'px';
  dragGhost.style.height = rect.height + 'px';
  dragGhost.style.left = (rect.left + rect.width/2) + 'px';
  dragGhost.style.top = (rect.top + rect.height/2) + 'px';
  const ghostRemoveBtn = dragGhost.querySelector('.remove-btn');
  if (ghostRemoveBtn) ghostRemoveBtn.remove();
  document.body.appendChild(dragGhost);
  card.classList.add('dragging');

  function onMove(ev){
    dragMoved = true;
    dragGhost.style.left = ev.clientX + 'px';
    dragGhost.style.top = ev.clientY + 'px';
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    document.getElementById('bank').classList.remove('drag-hover');
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const slot = target && target.closest('.slot');
    const bank = target && target.closest('.bank');
    if (slot) slot.classList.add('hover');
    else if (bank && originSlot !== undefined) bank.classList.add('drag-hover');
  }

  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    card.classList.remove('dragging');
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    document.getElementById('bank').classList.remove('drag-hover');

    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const slot = target && target.closest('.slot');
    const cardIdx = card.dataset.cardIdx;

    if (slot && dragMoved){ placeCardInSlot(cardIdx, slot.dataset.slot); }
    else if (dragMoved && originSlot !== undefined){ removeFromSlot(originSlot); }
    if (dragMoved) card.dataset.justDragged = '1';
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

render();
</script>
</body>
</html>
