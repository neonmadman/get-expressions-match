<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Exercise 2 Concept — Fill in the Gaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script>
/* ==========================================================================
   CONCEPT MOCKUP ONLY — 4 of 10 sentences, enough to show the mechanic.
   No drag-and-drop: just typed blanks, plus a small reference badge
   showing which of the 10 Exercise 1 expressions each sentence uses.
   Visual language matches the Exercise 1 build (get-expressions-match):
   same palette, accessible header color, circle numbering, rem-based
   sizing with the A-/A/A+ scale control.
   ========================================================================== */

// The full set of 10 Exercise 1 sentences — this is what "Expressions"
// actually refers to: the numbered sentences with the phrase bolded,
// shown here as a static reference list, not draggable.
const EXPRESSIONS = [
  { n: 1, letter: "a", sentence: "I can't wait to get away.", bold: "get away" },
  { n: 2, letter: "b", sentence: "I've always wanted to learn how to surf and I'll finally get to do it.", bold: "get to" },
  { n: 3, letter: "c", sentence: "I couldn't get over just how strong they are.", bold: "couldn't get over" },
  { n: 4, letter: "d", sentence: "Actually, I got into a bit of trouble once.", bold: "got into" },
  { n: 5, letter: "e", sentence: "I tried to get hold of it.", bold: "get hold of" },
  { n: 6, letter: "f", sentence: "It got swept away by the wave.", bold: "got swept away" },
  { n: 7, letter: "g", sentence: "I soon realized that I wasn't getting anywhere.", bold: "wasn't getting anywhere" },
  { n: 8, letter: "h", sentence: "I got the feeling I was being pulled out to sea.", bold: "got the feeling" },
  { n: 9, letter: "i", sentence: "So I waved to get someone's attention.", bold: "get someone's attention" },
  { n: 10, letter: "j", sentence: "I had a bad experience, but I soon got over it.", bold: "got over" }
];

// "BLANK" marks the single blank where the whole phrase goes (in its
// correct tense/form). refExpr is the Exercise 1 expression number —
// kept here only as an authoring note for you (not displayed).
// "BLANK" marks the single blank where the whole phrase goes (in its
// correct tense/form). letter is this phrase's a-j label. refExpr is the
// Exercise 1 expression number — kept only as an authoring note (not
// displayed).
const SENTENCES = [
  { letter: "a", parts: ["She ran out on the road to ", "BLANK", "."], refExpr: 9 },
  { letter: "b", parts: ["They were exhausted and hungry, but after some food and sleep they soon ", "BLANK", " the experience."], refExpr: 10 },
  { letter: "c", parts: ["When he saw the same tree for the third time, he began to ", "BLANK", " that he was lost."], refExpr: 8 },
  { letter: "d", parts: ["He went on a course about surviving in the woods and ", "BLANK", " put into practice his fire-making skills."], refExpr: 2 },
  { letter: "e", parts: ["They decided to ski off the main trail where the snow was fresh, but it was also quite dangerous and they soon ", "BLANK", " trouble."], refExpr: 4 },
  { letter: "f", parts: ["The boat was sinking, but we all managed to ", "BLANK", " a life-jacket."], refExpr: 5 },
  { letter: "g", parts: ["She was crossing the river, but the current was strong and she ", "BLANK", " by the water."], refExpr: 6 },
  { letter: "h", parts: ["They had been walking for hours, but they'd only walked about two kilometers. They felt like they ", "BLANK", "."], refExpr: 7 },
  { letter: "i", parts: ["They were in such a rush to ", "BLANK", " to the mountains, they left without taking sensible walking boots."], refExpr: 1 },
  { letter: "j", parts: ["When they were in the water, they ", "BLANK", " how high the waves were."], refExpr: 3 }
];

const root = document.getElementById('app');

const styleTag = document.createElement('style');
styleTag.textContent = `
  html{ font-size: 100%; } /* baseline the A-/A/A+ control multiplies against */
  :root{
    --board:#e8f3fc;
    --board-line: rgba(15,30,45,0.09);
    --chalk:#12181f;
    --chalk-dim: rgba(18,24,31,0.62);
    --accent:#1f6fa8;
    --coral:#c9463c;
    /* Same amber used for a filled Meanings box in get-expressions-match,
       reused here as the "this line is done" cue once a blank has a value
       and isn't currently focused. */
    --done-bg: #FEEABE;
    --done-bg-2: #FBDFA0;
    --done-border: #D9AF5C;
    /* Same accessible blue used for headers + circle numbering in
       get-expressions-match (was tested against #528CC7 at ~3.54:1,
       which fails; this passes at ~4.6:1). */
    --header-accent: #4679AA;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-serif: 'Lora', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at top left, rgba(255,255,255,0.7), transparent 55%), var(--board);
    background-attachment: fixed;
    font-family: var(--font-body);
    color: var(--chalk);
    padding: 28px 16px 60px;
  }
  #app{ max-width: 1320px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  h1{
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: clamp(1.4rem, 1.1rem + 1.3vw, 1.9rem);
    line-height: 1.2;
    margin: 0 0 8px;
  }
  .subtitle{ font-size: 1rem; color: var(--chalk-dim); margin: 0 0 4px; }

  .board{
    border: 1.5px dashed rgba(31,111,168,0.4);
    border-radius: 14px;
    padding: 26px 24px;
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(15,30,45,0.06);
  }

  .layout{ display:grid; grid-template-columns: 1.2fr 0.8fr; gap: 36px; align-items:start; }

  /* ---------- shared column-header style, matches Exercise 1 ---------- */
  .col-header{
    font-family: var(--font-mono);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: clamp(0.85rem, 0.8rem + 0.25vw, 1rem);
    color: var(--header-accent);
    margin: 0 0 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--board-line);
  }

  .ref-list{
    display:flex;
    flex-direction: column;
  }
  /* Same look as Exercise 1's left column: plain text, no box, no fill —
     a numbered circle, the phrase bolded inline. */
  .ref-item{
    display:flex;
    gap: 14px;
    align-items:center;
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    line-height: 1.45;
    padding-top: 16px;
    padding-bottom: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(31,111,168,0.18);
  }
  .ref-item:first-child{ padding-top: 10px; }
  .ref-item:last-child{ margin-bottom: 0; padding-bottom: 10px; border-bottom: none; }
  /* Underline-style emphasis for the bolded phrase within each
     Expression — subtler than a solid highlight block. */
  .ref-item strong{
    color: var(--chalk);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 3px;
    text-underline-offset: 3px;
  }

  /* ---------- circle badges, matches Exercise 1 exactly ---------- */
  .badge-circle{
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    color: #ffffff;
    background: var(--header-accent);
  }

  /* Phrases lettering — same quiet, muted "a)" label used for Meanings
     in Exercise 1: no circle, no bold color, just a small marker. */
  .letter-label{
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--chalk-dim);
    flex-shrink: 0;
  }

  .sentences-col{ display:flex; flex-direction:column; gap: 16px; }

  .row{
    position: relative;
    display:flex;
    align-items: center;
    gap: 14px;
    background: #fbfdff;
    border: 1.5px solid rgba(31,111,168,0.4);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 1px 3px rgba(15,30,45,0.06);
  }

  .sentence-text{
    flex: 1;
    font-family: var(--font-serif);
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    line-height: 1.75;
    color: var(--chalk);
  }

  input.blank{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    color: var(--chalk);
    border: 1.5px solid rgba(31,111,168,0.4);
    background: rgba(31,111,168,0.05);
    border-radius: 6px;
    padding: 4px 10px;
    min-width: 9rem;
    width: 9rem; /* JS grows this to fit content — never lets typed text get clipped */
    max-width: 100%;
    text-align: center;
    margin: 0 2px;
    transition: background .15s, border-color .15s;
  }
  input.blank:focus{ outline: none; background: rgba(31,111,168,0.12); border-color: var(--accent); }
  /* Filled + not focused = "done" cue. The :not(:focus) means this only
     shows once you click away — actively typing always looks like a
     normal active field, regardless of what's already in it. */
  input.blank.has-value:not(:focus){
    background: linear-gradient(180deg, var(--done-bg), var(--done-bg-2));
    border-color: var(--done-border);
  }

  .sentences-col-wrap{}

  .footer-bar{ display:flex; justify-content: center; align-items:center; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  button{
    font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 8px; border: 1.5px solid rgba(31,111,168,0.4);
    background: transparent; color: var(--chalk); cursor: pointer; transition: all .15s;
  }
  button:hover{ border-color: var(--accent); color: var(--accent); background: rgba(31,111,168,0.06); }
  button:focus-visible{ outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .text-scale-group{
    display:flex;
    align-items:stretch;
    border: 1.5px solid rgba(31,111,168,0.4);
    border-radius: 8px;
    overflow:hidden;
  }
  .text-scale-group button{
    border: none;
    border-radius: 0;
    border-right: 1.5px solid rgba(31,111,168,0.4);
  }
  .text-scale-group button:last-child{ border-right: none; }

  @media (max-width: 700px){
    .layout{ grid-template-columns: 1fr; gap: 24px; }
    .row{ flex-wrap: wrap; }
    input.blank{ min-width: 7rem; width: 7rem; }
  }
`;
document.head.appendChild(styleTag);

let textScalePct = 100;

// A hidden element, styled to exactly match input.blank's font, used only
// to measure how wide the typed text actually renders — so the visible
// box can be grown to match instead of ever silently clipping it.
const measurer = document.createElement('span');
measurer.style.cssText = 'position:absolute; visibility:hidden; white-space:pre; top:-9999px; left:-9999px;';
document.body.appendChild(measurer);

function autoGrowInput(inp){
  const cs = getComputedStyle(inp);
  measurer.style.fontFamily = cs.fontFamily;
  measurer.style.fontWeight = cs.fontWeight;
  measurer.style.fontSize = cs.fontSize;
  measurer.style.letterSpacing = cs.letterSpacing;
  measurer.textContent = inp.value || '';
  const textWidth = measurer.getBoundingClientRect().width;
  const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const minWidth = (window.innerWidth <= 700 ? 7 : 9) * rootPx; // matches the CSS min-width at this breakpoint
  const maxWidth = 30 * rootPx; // generous ceiling — comfortably fits any realistic phrase without runaway growth
  const desired = Math.max(minWidth, textWidth + 28); // +28 for left/right padding and border
  inp.style.width = Math.min(desired, maxWidth) + 'px';
}

function boldify(sentence, boldPhrase){
  if (!boldPhrase) return sentence;
  const idx = sentence.indexOf(boldPhrase);
  if (idx === -1) return sentence;
  const before = sentence.slice(0, idx);
  const match = sentence.slice(idx, idx + boldPhrase.length);
  const after = sentence.slice(idx + boldPhrase.length);
  return `${before}<strong>${match}</strong>${after}`;
}

function renderSentence(parts){
  let blankCount = 0;
  return parts.map(p => {
    if (p === "BLANK"){
      blankCount++;
      return `<input class="blank" type="text" aria-label="Blank ${blankCount}">`;
    }
    return p;
  }).join('');
}

function render(){
  root.innerHTML = `
    <header>
      <h1>BUILDING SENTENCES WITH PHRASES</h1>
      <p class="subtitle">Complete the sentences by matching with the correct form of the phrases. Keep an eye out for tense changes!</p>
    </header>
    <div class="board">
      <div class="layout">
        <div class="sentences-col-wrap">
          <h2 class="col-header">Phrases</h2>
          <div class="sentences-col">
            ${SENTENCES.map((s, i) => `
              <div class="row">
                <span class="badge-circle">${i+1}</span>
                <span class="sentence-text">${renderSentence(s.parts)}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="ref-panel">
          <h2 class="col-header">Expressions</h2>
          <div class="ref-list">
            ${EXPRESSIONS.map(ex => `
              <div class="ref-item">
                <span class="letter-label">${ex.letter})</span>
                <span>${boldify(ex.sentence, ex.bold)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="footer-bar">
      <div class="text-scale-group" role="group" aria-label="Adjust text size">
        <button id="scaleDown" aria-label="Decrease text size">A−</button>
        <button id="scaleReset" aria-label="Reset text size">A</button>
        <button id="scaleUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
  `;
  document.querySelectorAll('input.blank').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.classList.toggle('has-value', inp.value.trim().length > 0);
      autoGrowInput(inp);
    });
    autoGrowInput(inp); // set correct initial width even before typing starts
  });
  const clamp = (v) => Math.min(150, Math.max(70, v));
  const apply = () => {
    document.documentElement.style.fontSize = textScalePct + '%';
    // Font size just changed, so every blank's pixel width needs
    // recomputing — wait a frame so the browser has actually applied
    // the new font size before measuring against it.
    requestAnimationFrame(() => {
      document.querySelectorAll('input.blank').forEach(autoGrowInput);
    });
  };
  document.getElementById('scaleDown').addEventListener('click', () => { textScalePct = clamp(textScalePct - 10); apply(); });
  document.getElementById('scaleUp').addEventListener('click', () => { textScalePct = clamp(textScalePct + 10); apply(); });
  document.getElementById('scaleReset').addEventListener('click', () => { textScalePct = 100; apply(); });
}

render();
</script>
</body>
</html>
