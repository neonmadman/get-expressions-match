<script>
/* ==========================================================================
   DATA — this is the ONLY thing that changes between lessons. It's either
   the built-in default below, or it's decoded from the ?d= URL param
   (produced by edit.html). See loadData() further down.

   Shape:
   {
     type: "fillblank",
     header: { title, subtitle },
     sentences: [
       { parts: [ { text, isBlank }, ... ] }   // isBlank chunks render as
                                                // <input class="blank">;
                                                // their text is the answer.
     ],
     expressions: [ { sentence, bold } ]   // OPTIONAL. Only the built-in
                                            // default lesson has this — it's
                                            // the two-column reference panel
                                            // from Exercise 1. Teacher-made
                                            // lessons made in edit.html don't
                                            // set this, so they render a
                                            // simpler single-column layout.
   }
   ========================================================================== */

const DEFAULT_DATA = {
  type: "fillblank",
  header: {
    title: "BUILDING SENTENCES WITH PHRASES",
    subtitle: "Complete the sentences by matching with the correct form of the phrases. Keep an eye out for tense changes!"
  },
  sentences: [
    { parts: [ { text: "She ran out on the road to ", isBlank: false }, { text: "get someone's attention", isBlank: true }, { text: ".", isBlank: false } ] },
    { parts: [ { text: "They were exhausted and hungry, but after some food and sleep they soon ", isBlank: false }, { text: "got over", isBlank: true }, { text: " the experience.", isBlank: false } ] },
    { parts: [ { text: "When he saw the same tree for the third time, he began to ", isBlank: false }, { text: "get the feeling", isBlank: true }, { text: " that he was lost.", isBlank: false } ] },
    { parts: [ { text: "He went on a course about surviving in the woods and ", isBlank: false }, { text: "got to", isBlank: true }, { text: " put into practice his fire-making skills.", isBlank: false } ] },
    { parts: [ { text: "They decided to ski off the main trail where the snow was fresh, but it was also quite dangerous and they soon ", isBlank: false }, { text: "got into", isBlank: true }, { text: " trouble.", isBlank: false } ] },
    { parts: [ { text: "The boat was sinking, but we all managed to ", isBlank: false }, { text: "get hold of", isBlank: true }, { text: " a life-jacket.", isBlank: false } ] },
    { parts: [ { text: "She was crossing the river, but the current was strong and she ", isBlank: false }, { text: "got swept away", isBlank: true }, { text: " by the water.", isBlank: false } ] },
    { parts: [ { text: "They had been walking for hours, but they'd only walked about two kilometers. They felt like they ", isBlank: false }, { text: "weren't getting anywhere", isBlank: true }, { text: ".", isBlank: false } ] },
    { parts: [ { text: "They were in such a rush to ", isBlank: false }, { text: "get away", isBlank: true }, { text: " to the mountains, they left without taking sensible walking boots.", isBlank: false } ] },
    { parts: [ { text: "When they were in the water, they ", isBlank: false }, { text: "couldn't get over", isBlank: true }, { text: " how high the waves were.", isBlank: false } ] }
  ],
  expressions: [
    { sentence: "I can't wait to get away.", bold: "get away" },
    { sentence: "I've always wanted to learn how to surf and I'll finally get to do it.", bold: "get to" },
    { sentence: "I couldn't get over just how strong they are.", bold: "couldn't get over" },
    { sentence: "Actually, I got into a bit of trouble once.", bold: "got into" },
    { sentence: "I tried to get hold of it.", bold: "get hold of" },
    { sentence: "It got swept away by the wave.", bold: "got swept away" },
    { sentence: "I soon realized that I wasn't getting anywhere.", bold: "wasn't getting anywhere" },
    { sentence: "I got the feeling I was being pulled out to sea.", bold: "got the feeling" },
    { sentence: "So I waved to get someone's attention.", bold: "get someone's attention" },
    { sentence: "I had a bad experience, but I soon got over it.", bold: "got over" }
  ]
};

function loadData(){
  try{
    const params = new URLSearchParams(location.search);
    const d = params.get('d');
    if (!d) return DEFAULT_DATA;
    const json = LZString.decompressFromEncodedURIComponent(d);
    if (!json) return DEFAULT_DATA;
    const parsed = JSON.parse(json);
    if (!parsed || parsed.type !== 'fillblank' || !Array.isArray(parsed.sentences) || parsed.sentences.length === 0){
      return DEFAULT_DATA;
    }
    return parsed;
  } catch(e){
    console.warn('Could not load custom lesson data, using default.', e);
    return DEFAULT_DATA;
  }
}

const DATA = loadData();
const HAS_REFERENCE = Array.isArray(DATA.expressions) && DATA.expressions.length > 0;

const root = document.getElementById('app');

const styleTag = document.createElement('style');
styleTag.textContent = `

  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{

    background-attachment: fixed;

    padding: 28px 16px 60px;
  }
  #app{ max-width: 1320px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  h1{
    font-family: var(--font-body);
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: clamp(1.4rem, 1.1rem + 1.3vw, 1.9rem);
    line-height: 1.2;
    margin: 0 0 8px;
  }
  .subtitle{ font-size: 1rem; color: var(--chalk-dim); margin: 0 0 4px; }

  .board{
    border: 1.5px dashed rgba(31,111,168,0.4);

  }

  .layout{ display:grid; grid-template-columns: 1.2fr 0.8fr; gap: 36px; align-items:start; }
  .layout.single-col{ grid-template-columns: 1fr; max-width: 760px; margin: 0 auto; }

  /* ---------- shared column-header style, matches Exercise 1 ---------- */
  .col-header{
    font-family: var(--font-mono);

    align-items:center;

    margin-bottom: 24px;

  }
  .ref-item:first-child{ padding-top: 10px; }
  .ref-item:last-child{ margin-bottom: 0; padding-bottom: 10px; border-bottom: none; }
  /* Underline-style emphasis for the bolded phrase within each

  .ref-item strong{
    color: var(--chalk);
    font-weight: 700;

    text-decoration-color: var(--accent);

  }

  /* ---------- circle badges, matches Exercise 1 exactly ---------- */
  .badge-circle{

  }

  /* Phrases lettering — same quiet, muted "a)" label used for Meanings

  .letter-label{

  }

  .sentences-col{ display:flex; flex-direction:column; gap: 16px; }

  .sentence-text{

    font-family: var(--font-serif);

    color: var(--chalk);
  }

  .blank-wrap{
    position: relative;
    display: inline-block;
  }
  input.blank{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(1rem, 0.92rem + 0.4vw, 1.3rem);
    color: var(--chalk);
    border: 1.5px solid rgba(31,111,168,0.4);
    background: rgba(31,111,168,0.05);
    border-radius: 6px;
    padding: 4px 10px;
    min-width: 9rem;
    width: 9rem; /* JS grows this to fit content — never lets typed text get clipped */
    max-width: 100%;

    margin: 0 2px;
    transition: background .15s, border-color .15s;
  }
  input.blank:focus{ outline: none; background: rgba(31,111,168,0.12); border-color: var(--accent); }

document.head.appendChild(styleTag);

let textScalePct = 100;

// A hidden element, styled to exactly match input.blank's font, used only
// to measure how wide the typed text actually renders — so the visible
// box can be grown to match instead of ever silently clipping it.
const measurer = document.createElement('span');
measurer.style.cssText = 'position:absolute; visibility:hidden; white-space:pre; top:-9999px; left:-9999px;';
document.body.appendChild(measurer);

function autoGrowInput(inp){
  const cs = getComputedStyle(inp);
  measurer.style.fontFamily = cs.fontFamily;
  measurer.style.fontWeight = cs.fontWeight;
  measurer.style.fontSize = cs.fontSize;
  measurer.style.letterSpacing = cs.letterSpacing;
  measurer.textContent = inp.value || '';
  const textWidth = measurer.getBoundingClientRect().width;
  const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const minWidth = (window.innerWidth <= 700 ? 7 : 9) * rootPx; // matches the CSS min-width at this breakpoint
  const maxWidth = 30 * rootPx; // generous ceiling — comfortably fits any realistic phrase without runaway growth
  // Measure the field's actual padding/border rather than a fixed fudge
  // number — padding-right grows once the clear button appears, so a
  // hardcoded constant would start clipping text in the "has-value" state.
  const chrome = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0)
    + (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0) + 4;
  const desired = Math.max(minWidth, textWidth + chrome);
  inp.style.width = Math.min(desired, maxWidth) + 'px';
}

// DATA can now come from a teacher's own typed text (via edit.html), not
// just the fixed demo content — so anything from it that lands inside
// innerHTML needs escaping, or stray <, >, &, or " characters could
// corrupt the markup (or, for attribute contexts, break out of the
// attribute entirely).
function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function boldify(sentence, boldPhrase){
  if (!boldPhrase) return escapeHtml(sentence);
  const idx = sentence.indexOf(boldPhrase);
  if (idx === -1) return escapeHtml(sentence);
  const before = sentence.slice(0, idx);
  const match = sentence.slice(idx, idx + boldPhrase.length);
  const after = sentence.slice(idx + boldPhrase.length);
  return `${escapeHtml(before)}<strong>${escapeHtml(match)}</strong>${escapeHtml(after)}`;
}

function renderSentence(parts){
  let blankCount = 0;
  return parts.map(p => {
    if (p.isBlank){
      blankCount++;
      // A random, non-semantic name/autocomplete pair — Chrome will offer
      // its saved Address/Payment autofill on a plain unlabeled text input
      // if there's nothing telling it not to, even with autocomplete="off"
      // alone in some cases. A name Chrome can't pattern-match against any
      // known field type is the reliable way to suppress it.
      const rand = Math.random().toString(36).slice(2, 10);
      return `<span class="blank-wrap"><input class="blank" type="text" name="blank-${rand}" autocomplete="off" aria-label="Blank ${blankCount}"><button type="button" class="clear-blank" aria-label="Clear answer for blank ${blankCount}">×</button></span>`;
    }
    return escapeHtml(p.text);
  }).join('');
}

function render(){
  root.innerHTML = `
    <header>
      <h1>${escapeHtml(DATA.header.title)}</h1>
      <p class="subtitle">${escapeHtml(DATA.header.subtitle)}</p>
    </header>
    <div class="board">
      <div class="layout${HAS_REFERENCE ? '' : ' single-col'}">
        <div class="sentences-col-wrap">
          <h2 class="col-header">Phrases</h2>
          <div class="sentences-col">
            ${DATA.sentences.map((s, i) => `
              <div class="row">
                <span class="badge-circle">${i+1}</span>
                <span class="sentence-text">${renderSentence(s.parts)}</span>
              </div>
            `).join('')}
          </div>
        </div>
        ${HAS_REFERENCE ? `
        <div class="ref-panel">
          <h2 class="col-header">Expressions</h2>
          <div class="ref-list">
            ${DATA.expressions.map((ex, i) => `
              <div class="ref-item">
                <span class="letter-label">${String.fromCharCode(97 + i)})</span>
                <span>${boldify(ex.sentence, ex.bold)}</span>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
    <div class="footer-bar">
      <div class="text-scale-group" role="group" aria-label="Adjust text size">
        <button id="scaleDown" aria-label="Decrease text size">A−</button>
        <button id="scaleReset" aria-label="Reset text size">A</button>
        <button id="scaleUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
  `;
  document.querySelectorAll('input.blank').forEach(inp => {
    const wrap = inp.closest('.blank-wrap');
    inp.addEventListener('input', () => {
      const hasValue = inp.value.trim().length > 0;
      inp.classList.toggle('has-value', hasValue);
      if (wrap) wrap.classList.toggle('has-value', hasValue);
      autoGrowInput(inp);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){
        e.preventDefault();
        inp.blur(); // reuses the existing ":not(:focus)" rule that turns a filled blank gold
      }
    });
    autoGrowInput(inp); // set correct initial width even before typing starts
  });
  document.querySelectorAll('.clear-blank').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrap = btn.closest('.blank-wrap');
      const inp = wrap?.querySelector('input.blank');
      if (!inp) return;
      inp.value = '';
      inp.classList.remove('has-value');
      wrap.classList.remove('has-value');
      autoGrowInput(inp);
      inp.focus();
    });
  });
  const clamp = (v) => Math.min(150, Math.max(70, v));
  const apply = () => {
    document.documentElement.style.fontSize = textScalePct + '%';
    // Font size just changed, so every blank's pixel width needs
    // recomputing — wait a frame so the browser has actually applied
    // the new font size before measuring against it.
    requestAnimationFrame(() => {
      document.querySelectorAll('input.blank').forEach(autoGrowInput);
    });
  };
  document.getElementById('scaleDown').addEventListener('click', () => { textScalePct = clamp(textScalePct - 10); apply(); });
  document.getElementById('scaleUp').addEventListener('click', () => { textScalePct = clamp(textScalePct + 10); apply(); });
  document.getElementById('scaleReset').addEventListener('click', () => { textScalePct = 100; apply(); });
}

render();
</script>
</body>
</html>
