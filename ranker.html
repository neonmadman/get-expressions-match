<link rel="preconnect" href="https://fonts.googleapis.com">

<div id="app"></div>

<script>
/* ==========================================================================
   THE RANKER — students drag/click qualities from a bank into an ordered
   ranking list, then reorder that list with up/down buttons (no drag
   reordering within the list — buttons only, by design). Numbering in the
   ranking list is purely positional: it's recalculated from array order
   every render, never stored per-item.

   Interaction mechanic (drag + click-to-place + keyboard, card/slot
   selection model) is intentionally copied from index.html / categorize.html
   so it feels consistent with the rest of the site. The one structural
   difference: instead of dropping into a fixed, named slot, everything
   dropped/placed lands at the END of a single ordered list — reordering
   after that is a separate step, done with the up/down buttons.
   ========================================================================== */

/* ====================== EDIT THIS FOR EACH LESSON ====================== */
const HEADER_TITLE = "THE RANKER";
const HEADER_TAGLINE = "What do you think are the most important traits for a successful athlete?";
const HEADER_SUBTITLE = "Rank the qualities that you think make a successful athlete from most to least important. When you return to class, be prepared to explain why you chose your Top 2.";

const QUALITIES_HEADING = "Qualities";
const RANKING_HEADING = "Your Ranking";

// italic: the substring of text to italicize, or null for no emphasis.
const QUALITIES = [
  { text: "Genetics", italic: "Genetics" },
  { text: "Started playing sports at a young age", italic: null },
  { text: "Personal technique", italic: "technique" },
  { text: "Quality coaching", italic: null },
  { text: "Competitive mindset", italic: "Competitive" },
  { text: "Environment of advantage", italic: "advantage" },
  { text: "Money", italic: null }
];
/* ========================================================================= */

const root = document.getElementById('app');

const styleTag = document.createElement('style');
styleTag.textContent = `

  :root{

    --ink-dim: rgba(29,20,32,0.62);

       fills throughout. On its own it's ~3.6:1 against white, fine for

  }

  .ranked-row.selected{ outline: 2.5px solid var(--accent-dark); outline-offset: 2px; }
  .ranked-row:focus-visible{ outline: 2.5px solid var(--accent-dark); outline-offset: 2px; }

  /* Gold treatment for whichever two qualities currently sit at #1

  .ranked-row.rank-gold{

document.head.appendChild(styleTag);

/* ---------------- state ---------------- */
let ranked = [];           // ordered array of QUALITIES indices, position = rank
let selectedCard = null;   // currently selected QUALITIES index, or null
let textScalePct = 100;
let reorderState = null;   // { qIdx, rowHeight, targetIndex } while a reorder-drag is live, else null

function italicize(text, italicPhrase){
  if (!italicPhrase) return text;
  const idx = text.indexOf(italicPhrase);
  if (idx === -1) return text;
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + italicPhrase.length);
  const after = text.slice(idx + italicPhrase.length);
  return `${before}<em>${match}</em>${after}`;
}

function render(){
  root.innerHTML = `
    <header>
      <h1><span class="trophy" aria-hidden="true">🏆</span><span>${HEADER_TITLE}</span><span class="trophy" aria-hidden="true">🏆</span></h1>
      <h3 class="tagline">${HEADER_TAGLINE}</h3>
      <p class="subtitle">${HEADER_SUBTITLE}</p>
    </header>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="board" id="board">
      <div class="layout">
        <div class="qualities-panel">
          <h2 class="col-header">${QUALITIES_HEADING}</h2>
          <div class="bank" id="bank"></div>
        </div>
        <div class="ranking-panel">
          <h2 class="col-header">${RANKING_HEADING}</h2>
          <div class="ranking-list" id="rankingList"></div>
        </div>
      </div>
    </div>
    <div class="footer-bar">
      <div class="text-scale-group" role="group" aria-label="Adjust text size">
        <button id="scaleDown" aria-label="Decrease text size">A−</button>
        <button id="scaleReset" aria-label="Reset text size">A</button>
        <button id="scaleUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
  `;
  renderBank();
  renderRankingList();
  updateProgress();
  attachInteractions();
  attachScaleControls();
}

function renderBank(){
  const bank = document.getElementById('bank');
  bank.innerHTML = '';
  let anyLeft = false;
  QUALITIES.forEach((q, i) => {
    if (ranked.includes(i)) return;
    anyLeft = true;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.qualityIdx = i;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', q.text);
    card.innerHTML = `<span class="quality-text">${italicize(q.text, q.italic)}</span>`;
    bank.appendChild(card);
  });
  if (!anyLeft){
    bank.innerHTML = '<div class="bank-empty-msg">All qualities ranked</div>';
  }
}

/* Builds the list of what to render: normally just the ranked qualities
   in order, but while a reorder-drag is live, the dragged quality is
   pulled out and a same-height placeholder is spliced in at its current
   target index instead — that placeholder IS the "growing space". */
function computeDisplayTokens(){
  if (!reorderState){
    return ranked.map(qIdx => ({ type: 'quality', qIdx }));
  }
  const others = ranked.filter(qIdx => qIdx !== reorderState.qIdx);
  const tokens = others.map(qIdx => ({ type: 'quality', qIdx }));
  const insertAt = Math.max(0, Math.min(reorderState.targetIndex, tokens.length));
  tokens.splice(insertAt, 0, { type: 'placeholder' });
  return tokens;
}

function captureFlipRects(list){
  const rects = {};
  list.querySelectorAll('[data-flip-key]').forEach(el => {
    rects[el.dataset.flipKey] = el.getBoundingClientRect();
  });
  return rects;
}

/* FLIP: whatever moved between the "before" snapshot and the freshly
   rendered "after" DOM gets an inverse transform applied instantly, then
   animated back to zero — so rows visually glide into their new spot
   instead of snapping. */
function playFlipAnimation(list, prevRects){
  list.querySelectorAll('[data-flip-key]').forEach(el => {
    const key = el.dataset.flipKey;
    const before = prevRects[key];
    if (!before) return;
    const after = el.getBoundingClientRect();
    const deltaY = before.top - after.top;
    if (Math.abs(deltaY) < 1) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${deltaY}px)`;
    el.getBoundingClientRect(); // force reflow so the jump above applies before we animate away from it
    requestAnimationFrame(() => {
      el.style.transition = 'transform 200ms ease';
      el.style.transform = '';
    });
  });
}

function renderRankingList(){
  const list = document.getElementById('rankingList');
  const prevRects = captureFlipRects(list);
  list.innerHTML = '';

  const tokens = computeDisplayTokens();

  tokens.forEach((tok, pos) => {
    if (tok.type === 'placeholder'){
      const ph = document.createElement('div');
      ph.className = 'rank-placeholder';
      ph.dataset.flipKey = 'placeholder';
      ph.style.height = (reorderState ? reorderState.rowHeight : 0) + 'px';
      list.appendChild(ph);
      return;
    }
    const qIdx = tok.qIdx;
    const q = QUALITIES[qIdx];
    const row = document.createElement('div');
    row.className = 'ranked-row' + (pos < 2 ? ' rank-gold' : '');
    row.dataset.qualityIdx = qIdx;
    row.dataset.flipKey = 'q' + qIdx;
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `Rank ${pos + 1}: ${q.text}. Press Delete to remove, drag to reorder, or use the up and down buttons.`);
    row.innerHTML = `
      <span class="badge-circle">${pos + 1}</span>
      <span class="ranked-text">${italicize(q.text, q.italic)}</span>
      <span class="order-btns">
        <button class="order-btn" type="button" data-move="up" data-quality-idx="${qIdx}" aria-label="Move ${q.text} up" ${pos === 0 ? 'disabled' : ''}>&#9650;</button>
        <button class="order-btn" type="button" data-move="down" data-quality-idx="${qIdx}" aria-label="Move ${q.text} down" ${pos === tokens.length - 1 ? 'disabled' : ''}>&#9660;</button>
      </span>
      <button class="remove-btn" type="button" data-remove-idx="${qIdx}" aria-label="Remove ${q.text} from your ranking">&times;</button>
    `;
    list.appendChild(row);
  });

  if (!reorderState){
    if (ranked.length < QUALITIES.length){
      const addSlot = document.createElement('div');
      addSlot.className = 'add-slot';
      addSlot.id = 'addSlot';
      addSlot.setAttribute('role', 'button');
      addSlot.setAttribute('tabindex', '0');
      addSlot.textContent = ranked.length === 0
        ? 'Drag a quality here, or tap one above and then tap here'
        : '+ Add a quality here';
      addSlot.setAttribute('aria-label', 'Add the selected quality to your ranking');
      list.appendChild(addSlot);
    } else {
      const full = document.createElement('div');
      full.className = 'ranking-full-msg';
      full.textContent = 'All qualities ranked';
      list.appendChild(full);
    }
  }

  playFlipAnimation(list, prevRects);
}

function updateProgress(){
  const pct = Math.round((ranked.length / QUALITIES.length) * 100);
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

function addToRanking(qIdx){
  qIdx = Number(qIdx);
  ranked = ranked.filter(i => i !== qIdx);
  ranked.push(qIdx);
  selectedCard = null;
  renderBank();
  renderRankingList();
  updateProgress();
  attachInteractions();
}

function removeFromRanking(qIdx){
  qIdx = Number(qIdx);
  if (!ranked.includes(qIdx)) return;
  ranked = ranked.filter(i => i !== qIdx);
  selectedCard = null;
  renderBank();
  renderRankingList();
  updateProgress();
  attachInteractions();
}

function moveRank(qIdx, direction){
  qIdx = Number(qIdx);
  const pos = ranked.indexOf(qIdx);
  if (pos === -1) return;
  const swapWith = direction === 'up' ? pos - 1 : pos + 1;
  if (swapWith < 0 || swapWith >= ranked.length) return;
  [ranked[pos], ranked[swapWith]] = [ranked[swapWith], ranked[pos]];
  renderRankingList();
  attachInteractions();
}

/* ---------------- interactions ---------------- */
function clearSelection(){
  document.querySelectorAll('.card.selected, .ranked-row.selected').forEach(el => el.classList.remove('selected'));
  selectedCard = null;
}

function attachInteractions(){
  document.querySelectorAll('.bank .card').forEach(card => {
    card.addEventListener('click', () => {
      if (card.dataset.justDragged === '1') { card.dataset.justDragged = '0'; return; }
      const idx = card.dataset.qualityIdx;
      if (selectedCard === idx){ clearSelection(); return; }
      clearSelection();
      selectedCard = idx;
      card.classList.add('selected');
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.click(); }
    });
    card.addEventListener('pointerdown', (e) => startCardDrag(e, card, Number(card.dataset.qualityIdx), 'bank'));
  });

  document.querySelectorAll('.ranked-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.order-btn') || e.target.closest('.remove-btn')) return;
      if (row.dataset.justDragged === '1') { row.dataset.justDragged = '0'; return; }
      const idx = row.dataset.qualityIdx;
      if (selectedCard === idx){ clearSelection(); return; }
      clearSelection();
      selectedCard = idx;
      row.classList.add('selected');
    });
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); row.click(); }
    });
    row.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.order-btn') || e.target.closest('.remove-btn')) return;
      startCardDrag(e, row, Number(row.dataset.qualityIdx), 'ranked');
    });
  });

  document.querySelectorAll('.order-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveRank(btn.dataset.qualityIdx, btn.dataset.move);
    });
  });

  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeFromRanking(btn.dataset.removeIdx);
    });
  });

  const addSlot = document.getElementById('addSlot');
  if (addSlot){
    addSlot.addEventListener('click', () => {
      if (selectedCard !== null) addToRanking(selectedCard);
    });
    addSlot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); addSlot.click(); }
    });
  }
}

document.addEventListener('keydown', (e) => {
  if (selectedCard === null) return;
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (ranked.includes(Number(selectedCard))){
      e.preventDefault();
      removeFromRanking(selectedCard);
    }
  } else if (e.key === 'Escape'){
    clearSelection();
  }
});

function attachScaleControls(){
  const clamp = (v) => Math.min(150, Math.max(70, v));
  const apply = () => { document.documentElement.style.fontSize = textScalePct + '%'; };
  document.getElementById('scaleDown').addEventListener('click', () => { textScalePct = clamp(textScalePct - 10); apply(); });
  document.getElementById('scaleUp').addEventListener('click', () => { textScalePct = clamp(textScalePct + 10); apply(); });
  document.getElementById('scaleReset').addEventListener('click', () => { textScalePct = 100; apply(); });
}

/* ---------------- drag and drop (Qualities <-> Your Ranking) ---------------- */
/* One shared "space-making" drag for both directions: dragging a bank
   card toward the ranking list, and dragging a ranked row to reposition
   it. Nothing visual happens until the pointer has actually moved a few
   pixels, so a plain click/tap always falls through to its normal click
   handler untouched.

   Once a real drag starts, the dragged item is represented purely by a
   floating ghost plus a same-height placeholder spliced into the ranking
   list at the current target index. That target index is recalculated
   on every move by comparing the pointer to each currently-listed row's
   midpoint. Whenever it changes, the list re-renders and FLIP animates
   the rows sliding into their new spots — so the gap visibly grows and
   shrinks to make room, instead of a static insertion line — and this
   now applies whether the item is coming from the Qualities bank or
   already lives in the ranking list.

   For a bank card, the live preview only kicks in once the pointer
   actually enters the ranking panel (before that it's just a normal
   drag with nothing reserved yet); leaving the panel again cancels the
   preview. For a ranked row, the preview is live for the whole drag,
   and dropping over the Qualities column removes it — same as the
   remove button. */
function startCardDrag(e, sourceEl, qIdx, origin){
  e.preventDefault();
  const rect = sourceEl.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let started = false;
  let ghost = null;

  function computeTargetIndex(centerY){
    const others = document.querySelectorAll('#rankingList .ranked-row[data-quality-idx]');
    let idx = 0;
    others.forEach(el => {
      const r = el.getBoundingClientRect();
      if (centerY > r.top + r.height / 2) idx++;
    });
    return idx;
  }

  // Builds the floating ghost. For a ranked row, clone it directly. For
  // a bank card, build a ranked-row-shaped ghost instead of cloning the
  // (shorter, unnumbered) bank card — so its height matches what will
  // actually be inserted, and the placeholder it drives is sized right.
  function makeGhost(){
    let el;
    if (origin === 'ranked'){
      el = sourceEl.cloneNode(true);
      const ob = el.querySelector('.order-btns'); if (ob) ob.remove();
      const rb = el.querySelector('.remove-btn'); if (rb) rb.remove();
      el.style.width = rect.width + 'px';
    } else {
      const colWidth = document.getElementById('rankingList').getBoundingClientRect().width;
      const q = QUALITIES[qIdx];
      el = document.createElement('div');
      el.className = 'ranked-row';
      el.innerHTML = `<span class="badge-circle">+</span><span class="ranked-text">${italicize(q.text, q.italic)}</span>`;
      el.style.width = colWidth + 'px';
    }
    el.classList.add('drag-ghost');
    document.body.appendChild(el);
    const height = el.getBoundingClientRect().height;
    el.style.height = height + 'px';
    return { el, height };
  }

  function beginVisualDrag(ev){
    started = true;
    if (origin === 'bank') sourceEl.classList.add('dragging');
    const built = makeGhost();
    ghost = built.el;
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top = ev.clientY + 'px';

    if (origin === 'ranked'){
      reorderState = { qIdx, rowHeight: built.height, targetIndex: ranked.indexOf(qIdx) };
      renderRankingList();
      attachInteractions();
    }
    // Bank-origin: reorderState stays null until the pointer actually
    // enters the ranking panel — handled in onMove below.
  }

  function onMove(ev){
    if (!started){
      if (Math.abs(ev.clientX - startX) < 4 && Math.abs(ev.clientY - startY) < 4) return;
      beginVisualDrag(ev);
    }
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top = ev.clientY + 'px';

    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const rankingPanel = target && target.closest('.ranking-panel');
    const qualitiesPanel = target && target.closest('.qualities-panel');
    let needsRender = false;

    if (origin === 'bank'){
      if (rankingPanel){
        const newIdx = computeTargetIndex(ev.clientY);
        if (!reorderState){
          reorderState = { qIdx, rowHeight: ghost.getBoundingClientRect().height, targetIndex: newIdx };
          needsRender = true;
        } else if (reorderState.targetIndex !== newIdx){
          reorderState.targetIndex = newIdx;
          needsRender = true;
        }
      } else if (reorderState){
        reorderState = null;
        needsRender = true;
      }
    } else {
      const newIdx = computeTargetIndex(ev.clientY);
      if (reorderState.targetIndex !== newIdx){
        reorderState.targetIndex = newIdx;
        needsRender = true;
      }
      document.getElementById('bank').classList.toggle('drag-hover', !!qualitiesPanel);
    }

    if (needsRender){
      renderRankingList();
      attachInteractions();
    }
  }

  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);

    if (!started) return; // never moved — a plain click, let the source's own click handler run

    if (origin === 'bank') sourceEl.classList.remove('dragging');
    if (ghost) ghost.remove();
    document.getElementById('bank').classList.remove('drag-hover');

    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const rankingPanel = target && target.closest('.ranking-panel');
    const qualitiesPanel = target && target.closest('.qualities-panel');

    if (origin === 'ranked'){
      const finalIndex = reorderState.targetIndex;
      reorderState = null;
      if (qualitiesPanel){
        removeFromRanking(qIdx);
        return;
      }
      const others = ranked.filter(i => i !== qIdx);
      others.splice(finalIndex, 0, qIdx);
      ranked = others;
      selectedCard = null;
      renderBank();
      renderRankingList();
      updateProgress();
      attachInteractions();
      return;
    }

    // origin 'bank'
    if (reorderState && rankingPanel){
      const finalIndex = reorderState.targetIndex;
      reorderState = null;
      const next = ranked.filter(i => i !== qIdx);
      next.splice(finalIndex, 0, qIdx);
      ranked = next;
      selectedCard = null;
      renderBank();
      renderRankingList();
      updateProgress();
      attachInteractions();
    } else {
      reorderState = null;
      renderRankingList();
      attachInteractions();
    }
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

render();
</script>
