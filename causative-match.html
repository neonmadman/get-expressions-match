<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sort the Sentences — Causative Have/Get</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/google-sans-flex:vf@latest/wght.css">
</head>
<body>

<div id="app"></div>

<script>
/* ==========================================================================
   "Sort the Sentences" — restyled to match the diagnostic's approved look
   (Google Sans Flex, glossy flat color, big bold badges, soft blurred
   decor blobs), same drag-and-drop mechanic as before, same content.

   Mechanic unchanged from the prior build: many-to-one bucket sort
   (`placed[cardIdx] = bucketIdx`, not the one-to-one slot model used
   elsewhere on the site), drag + click-to-place, no auto-grading —
   correctBucket is an authoring note only, never read by the code.

   What's new here is purely visual: each bucket gets one of the named
   accents from the diagnostic (sky / peony / plum). Bank cards are a
   neutral, unsorted color; once dropped into a bucket, a card adopts
   that bucket's accent as a solid fill — same "selection = solid color"
   language as the diagnostic's option pills, so the two exercises read
   as part of the same set.
   ========================================================================== */

/* ====================== EDIT THIS FOR EACH LESSON ====================== */
const HEADER_TITLE = "Sort the Sentences";
const HEADER_SUBTITLE = "Drag each sentence into the box for why <strong>have/get</strong> is used.";

const BUCKETS = [
  { letter: "A", text: "The subject arranges or pays for somebody to do something", accent: 0 },
  { letter: "B", text: "The subject has a bad experience caused by someone else", accent: 1 }
];

// correctBucket is an authoring note only (0 = A, 1 = B) — never
// read by the interaction code, never used to grade. Sentences stay in
// their original numbered order in the bank.
const SENTENCES = [
  { text: "Last time I went to the dentist I had to have two teeth taken out\u2014now it's four!", correctBucket: 0 },
  { text: "Have you had your hair done? Your stylist is amazing.", correctBucket: 0 },
  { text: "They had their wedding cake ruined by a clumsy waiter.", correctBucket: 1 },
  { text: "I've had my heart broken too many times\u2014I didn't want to fall in love again.", correctBucket: 1 },
  { text: "I need to get my eyes checked. I can't see anybody in the back row.", correctBucket: 0 },
  { text: "My neighbors had their car stolen last week! We need to move out of this city.", correctBucket: 1 },
  { text: "I had my wedding photos taken by a lazy teenager and I refuse to pay for them.", correctBucket: 0 },
  { text: "Steve had his suit ripped during the first dance.", correctBucket: 1 }
];
/* ========================================================================= */

// Same 2 named accents as the diagnostic, used for the bucket chrome.
// "dark" is a deeper shade of each hue, used only for the bucket border.
const ACCENTS = [
  { name: "sky",   bg: "#2F8FE0", tint: "#E7F1FC", dark: "#163E73" },
  { name: "peony", bg: "#DC4C86", tint: "#FBE8F0", dark: "#8E2350" }
];

// A separate palette for numbering/coloring the individual sentence cards.
// Deliberately disjoint from ACCENTS above (no blue, no pink) so a card's
// color never coincidentally matches its correct bucket and hints at the
// answer. Cycles by sentence position, same pattern as the diagnostic's
// per-item accent — identity, not correctness.
const CARD_ACCENTS = [
  { bg: "#EDA200", tint: "#FDF3E0" }, // gold
  { bg: "#2E9A63", tint: "#E4F5EC" }, // sage
  { bg: "#7C5CD1", tint: "#EFEAFB" }, // plum
  { bg: "#C4563A", tint: "#FBEAE4" }  // rust
];

const root = document.getElementById('app');

const styleTag = document.createElement('style');
styleTag.textContent = `
  :root{
    --ink:#14161C;
    --ink-dim:#5B5F6B;
    --paper:#FAF9F7;
    --card:#FFFFFF;
    --sand:#F1EEE9;
    --sand-border: rgba(20,22,28,0.14);
    --line: rgba(20,22,28,0.08);
    --font: 'Google Sans Flex Variable', 'Google Sans', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: var(--paper);
    font-family: var(--font);
    color: var(--ink);
    padding: 40px 20px 70px;
  }
  #app{ max-width: 980px; margin: 0 auto; }

  .decor{
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.16;
    z-index: -1;
    pointer-events: none;
  }
  .decor-1{ width: 420px; height: 420px; background: #2F8FE0; top: -160px; left: -140px; }
  .decor-2{ width: 380px; height: 380px; background: #DC4C86; bottom: -140px; right: -120px; }

  header{ margin-bottom: 30px; }
  h1{
    font-weight: 900;
    font-size: clamp(2.1rem, 1.7rem + 1.8vw, 3.1rem);
    line-height: 1.03;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .subtitle{
    font-weight: 500;
    font-size: clamp(1rem, 0.95rem + 0.2vw, 1.1rem);
    color: var(--ink-dim);
    margin: 0;
  }
  .subtitle strong{ color: var(--ink); font-weight: 800; }

  .progress-wrap{ max-width: 320px; margin: 22px 0 0; }
  .progress-track{ height: 8px; border-radius: 999px; background: var(--sand); overflow:hidden; }
  .progress-fill{ height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2F8FE0, #DC4C86); width: 0%; transition: width .3s; }

  .section-label{
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 30px 0 12px;
  }

  /* ---------- Sentence bank ---------- */
  .bank{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 20px;
    border-radius: 18px;
    transition: background .15s;
  }
  .bank.drag-hover{ background: var(--sand); padding: 10px; }
  .bank-empty-msg{
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--ink-dim);
    padding: 10px 2px;
  }

  /* ---------- cards ---------- */
  .card{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 12px 36px 12px 12px;
    border-radius: 14px;
    border: 1.5px solid transparent;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 600;
    font-size: clamp(0.92rem, 0.88rem + 0.2vw, 1rem);
    line-height: 1.4;
    cursor: grab;
    user-select: none;
    touch-action: none;
    position: relative;
    max-width: 100%;
    transition: transform .1s;
  }
  .bank .card{ flex: 1 1 260px; max-width: 320px; }
  .card:hover{ transform: translateY(-1px); }
  .card.dragging{ cursor: grabbing; }
  .card.selected{ outline: 2.5px solid var(--ink); outline-offset: 2px; }
  .card:focus-visible{ outline: 2.5px solid var(--ink); outline-offset: 2px; }

  .card-num{
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 900;
    font-size: 0.78rem;
    color: #ffffff;
  }
  .card-text{ padding-top: 2px; }

  .bucket .card{
    width: 100%;
    margin-bottom: 10px;
    padding-right: 40px;
  }
  .bucket .card:last-child{ margin-bottom: 0; }

  .remove-btn{
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid rgba(20,22,28,0.15);
    background: #ffffff;
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    padding: 0;
  }
  .remove-btn:hover{ background: #c9463c; border-color: #c9463c; color: #ffffff; }

  /* ---------- buckets ---------- */
  .buckets{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 12px;
  }
  .bucket-col{ display:flex; flex-direction:column; }
  .bucket-label{
    display:flex;
    gap: 10px;
    align-items:flex-start;
    margin-bottom: 12px;
  }
  .bucket-letter{
    flex-shrink:0;
    width: 30px;
    height: 30px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 900;
    font-size: 0.92rem;
    color: #ffffff;
  }
  .bucket-text{
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    padding-top: 4px;
  }
  .bucket{
    min-height: 130px;
    border-radius: 18px;
    border: 3px solid transparent;
    padding: 12px;
    transition: filter .15s, box-shadow .2s;
    flex: 1;
    box-shadow: inset 0 6px 14px rgba(0,0,0,0.35), inset 0 2px 4px rgba(0,0,0,0.22);
  }
  .bucket.hover{
    filter: brightness(1.08);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.12);
  }
  .bucket-empty-msg{
    font-weight: 700;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.85);
    text-align:center;
    padding: 24px 4px;
  }

  .drag-ghost{
    position: fixed;
    pointer-events: none;
    z-index: 999;
    opacity: 0.95;
    transform: translate(-50%, -50%) rotate(-2deg);
  }

  .footer-bar{ display:flex; justify-content: center; margin-top: 32px; }
  button{
    font-family: var(--font);
    font-weight: 800;
    font-size: 0.85rem;
    padding: 11px 18px;
    border-radius: 999px;
    border: none;
    background: var(--sand);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s;
  }
  button:hover{ background: #E7E3DC; }
  button:focus-visible{ outline: 2.5px solid var(--ink); outline-offset: 2px; }
  .text-scale-group{ display:flex; align-items:stretch; gap: 6px; }

  @media (max-width: 780px){
    .buckets{ grid-template-columns: 1fr; }
  }
`;
document.head.appendChild(styleTag);

/* ---------------- state ---------------- */
// placed: { cardIdx: bucketIdx }
let placed = {};
let selectedCard = null;
let textScalePct = 100;

function render(){
  root.innerHTML = `
    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>
    <header>
      <h1>${HEADER_TITLE}</h1>
      <p class="subtitle">${HEADER_SUBTITLE}</p>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </header>
    <div class="section-label">Sentences</div>
    <div class="bank" id="bank"></div>
    <div class="buckets" id="buckets">
      ${BUCKETS.map((b, i) => {
        const accent = ACCENTS[b.accent];
        return `
        <div class="bucket-col">
          <div class="bucket-label">
            <span class="bucket-letter" style="background:${accent.bg}">${b.letter}</span>
            <span class="bucket-text">${b.text}</span>
          </div>
          <div class="bucket" data-bucket="${i}" id="bucket-${i}" role="button" tabindex="0" aria-label="Bucket ${b.letter}: ${b.text}" style="background:${accent.bg}; border-color:${accent.dark};"></div>
        </div>`;
      }).join('')}
    </div>
    <div class="footer-bar">
      <div class="text-scale-group" role="group" aria-label="Adjust text size">
        <button id="scaleDown" aria-label="Decrease text size">A\u2212</button>
        <button id="scaleReset" aria-label="Reset text size">A</button>
        <button id="scaleUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
  `;
  renderBank();
  renderBuckets();
  attachInteractions();
  attachScaleControls();
}

function renderBank(){
  const bank = document.getElementById('bank');
  bank.innerHTML = '';
  let anyLeft = false;
  SENTENCES.forEach((s, i) => {
    if (placed[i] !== undefined) return;
    anyLeft = true;
    const cardAccent = CARD_ACCENTS[i % CARD_ACCENTS.length];
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cardIdx = i;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Sentence ${i + 1}: ${s.text}`);
    card.style.background = cardAccent.tint;
    card.style.borderColor = cardAccent.bg + '55';
    card.innerHTML = `<span class="card-num" style="background:${cardAccent.bg}">${i + 1}</span><span class="card-text">${s.text}</span>`;
    bank.appendChild(card);
  });
  if (!anyLeft){
    bank.innerHTML = '<div class="bank-empty-msg">All sentences placed \u2014 nice work.</div>';
  }
}

function renderBuckets(){
  BUCKETS.forEach((b, bi) => {
    const el = document.getElementById('bucket-' + bi);
    if (!el) return;
    el.classList.remove('hover');
    const cardIdxs = Object.keys(placed).filter(k => placed[k] === bi).map(Number);
    if (cardIdxs.length === 0){
      el.innerHTML = '<div class="bucket-empty-msg">drop sentences here</div>';
      return;
    }
    el.innerHTML = cardIdxs.map(ci => {
      const cardAccent = CARD_ACCENTS[ci % CARD_ACCENTS.length];
      return `
      <div class="card" data-card-idx="${ci}" data-in-bucket="${bi}" role="button" tabindex="0" style="background:${cardAccent.tint}; border-color:${cardAccent.bg}55;" aria-label="Sentence ${ci + 1}: ${SENTENCES[ci].text}, placed in bucket ${b.letter}. Press Delete to remove.">
        <span class="card-num" style="background:${cardAccent.bg}">${ci + 1}</span><span class="card-text">${SENTENCES[ci].text}</span>
        <button class="remove-btn" data-remove-card="${ci}" aria-label="Remove this sentence" type="button">\u00d7</button>
      </div>`;
    }).join('');
  });
}

function updateProgress(){
  const filled = Object.keys(placed).length;
  const pct = Math.round((filled / SENTENCES.length) * 100);
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

function placeCardInBucket(cardIdx, bucketIdx){
  cardIdx = Number(cardIdx);
  bucketIdx = Number(bucketIdx);
  placed[cardIdx] = bucketIdx;
  selectedCard = null;
  renderBank();
  renderBuckets();
  updateProgress();
  attachInteractions();
}

function removeFromBucket(cardIdx){
  cardIdx = Number(cardIdx);
  if (placed[cardIdx] === undefined) return;
  delete placed[cardIdx];
  selectedCard = null;
  renderBank();
  renderBuckets();
  updateProgress();
  attachInteractions();
}

/* ---------------- interactions ---------------- */
function attachInteractions(){
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.remove-btn')) return;
      if (card.dataset.justDragged === '1') { card.dataset.justDragged = '0'; return; }
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      if (selectedCard === card.dataset.cardIdx){ selectedCard = null; }
      else { selectedCard = card.dataset.cardIdx; card.classList.add('selected'); }
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.click(); }
    });
    card.addEventListener('pointerdown', (e) => { if (!e.target.closest('.remove-btn')) startDrag(e, card); });
  });

  document.querySelectorAll('.bucket').forEach(bucket => {
    bucket.addEventListener('click', () => {
      if (selectedCard !== null) placeCardInBucket(selectedCard, bucket.dataset.bucket);
    });
    bucket.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); bucket.click(); }
    });
  });

  const bank = document.getElementById('bank');
  bank.addEventListener('click', (e) => {
    if (e.target !== bank) return; // only the empty area, not a card inside it
    if (selectedCard !== null){
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      selectedCard = null;
    }
  });

  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromBucket(btn.dataset.removeCard); });
  });
}

function attachScaleControls(){
  const clamp = (v) => Math.min(150, Math.max(70, v));
  const apply = () => { document.documentElement.style.fontSize = textScalePct + '%'; };
  document.getElementById('scaleDown').addEventListener('click', () => { textScalePct = clamp(textScalePct - 10); apply(); });
  document.getElementById('scaleUp').addEventListener('click', () => { textScalePct = clamp(textScalePct + 10); apply(); });
  document.getElementById('scaleReset').addEventListener('click', () => { textScalePct = 100; apply(); });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' && selectedCard !== null){
    if (placed[selectedCard] !== undefined){ e.preventDefault(); removeFromBucket(selectedCard); }
  } else if (e.key === 'Escape' && selectedCard !== null){
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    selectedCard = null;
  }
});

let dragGhost = null;
let dragMoved = false;

function startDrag(e, card){
  e.preventDefault();
  dragMoved = false;
  const rect = card.getBoundingClientRect();
  const originBucket = card.dataset.inBucket;

  dragGhost = card.cloneNode(true);
  dragGhost.classList.add('drag-ghost');
  dragGhost.style.width = rect.width + 'px';
  const ghostRemoveBtn = dragGhost.querySelector('.remove-btn');
  if (ghostRemoveBtn) ghostRemoveBtn.remove();
  dragGhost.style.left = (rect.left + rect.width/2) + 'px';
  dragGhost.style.top = (rect.top + rect.height/2) + 'px';
  document.body.appendChild(dragGhost);
  card.classList.add('dragging');

  function onMove(ev){
    dragMoved = true;
    dragGhost.style.left = ev.clientX + 'px';
    dragGhost.style.top = ev.clientY + 'px';
    document.querySelectorAll('.bucket').forEach(b => b.classList.remove('hover'));
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const bucket = target && target.closest('.bucket');
    if (bucket) bucket.classList.add('hover');
  }

  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    card.classList.remove('dragging');
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    document.querySelectorAll('.bucket').forEach(b => b.classList.remove('hover'));

    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const bucket = target && target.closest('.bucket');
    const bank = target && target.closest('#bank');
    const cardIdx = card.dataset.cardIdx;

    if (bucket && dragMoved){ placeCardInBucket(cardIdx, bucket.dataset.bucket); }
    else if (bank && dragMoved && originBucket !== undefined){ removeFromBucket(cardIdx); }
    if (dragMoved) card.dataset.justDragged = '1';
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

render();
</script>
</body>
</html>
